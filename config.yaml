# ============================================================
# 포켓몬 카드 리스톡 체커 설정
# ============================================================

# ---- 폰 푸시 알림 (ntfy.sh — 무료) ----------------------------
# 1) 폰에 "ntfy" 앱 설치 (App Store / Play Store)
# 2) 앱에서 아래 topic 이름으로 구독(Subscribe)
# 3) topic은 비밀번호 같은 것! 유추 어려운 이름으로 바꿔 쓰세요.
#    친구들도 같은 topic을 구독하면 똑같이 알림을 받아요.
ntfy:
  server: https://ntfy.sh
  topic: pkmn-restock-pang-i96vygqb   # 이 이름으로 ntfy 앱에서 구독하세요
  enabled: true

# ---- 대시보드 (GitHub Pages) --------------------------------
dashboard:
  title: "포켓몬 카드 리스톡 트래커"
  # 배포 후 본인 GitHub Pages 주소로 변경 (알림 클릭 시 열릴 링크)
  url: "https://pangpanggit.github.io/pokemon-restock-tracker/"

# ---- 🎯 관심 상품 (꼭 살 것) ---------------------------------
# 국내외 아무 쇼핑몰 상품 URL이나 넣으면 됩니다 (스마트스토어, 쿠팡, 11번가,
# 포켓몬센터 등). 전체 스캔보다 훨씬 촘촘하게(기본 45초, 집중시간 15초) 돕니다.
#
# 새 상품 넣을 때마다 꼭 한 번:  python check.py --probe "상품URL"
#   → 품절 상태에서 '품절'로 판정되는지 확인. 엉뚱한 문구에 걸리면
#     sold_out_text / in_stock_text 로 판정 기준을 고정하세요.
watchlist:
  enabled: true
  interval_sec: 45          # 평상시 관심상품 체크 간격
  hot_interval_sec: 15      # 집중 시간대 간격
  # 관심상품 전용 집중 시간대 (KST). intervals.hot_windows(미국 몰 시간)에도 같이 집중함.
  # 국내 몰은 업무시간 오픈/재고반영이 많아 우선 아래로 시작 →
  # 대시보드 '재입고 기록'이 쌓이면 실제 뜬 시간대로 고치세요.
  hot_windows:
    - "09:50-11:30"
    - "13:50-15:30"
    - "19:50-20:30"
  gap_sec: 1.5              # 상품 사이 간격 (같은 사이트 연타 방지)
  open_browser: true        # 재고 뜨면 체커 PC 브라우저에서 상품 페이지 자동 오픈
  repeat_alert_minutes: 2   # 재고가 남아있는 동안 N분마다 재알림 (0 = 끔)
  notify_on_change: true    # 판정은 그대로인데 페이지 신호가 바뀌면 '👀 변화 감지' 알림
  products: []
    # - name: "상품 이름 (알아보기 쉽게)"
    #   url: "https://smartstore.naver.com/xxxx/products/1234567890"
    #   must: true            # true = 꼭 살 것 (최우선 알림 + 재알림)
    #   bought: false         # 샀으면 true → 알림 중지
    #   note: "1인 2개 제한, 네이버페이"   # 대시보드에 메모로 표시
    #   # 판정이 틀릴 때만 (페이지 문구 그대로, 대소문자 무시):
    #   # sold_out_text: ["일시품절"]
    #   # in_stock_text: ["구매하기"]

# ---- Pokémon Center -----------------------------------------
pokemoncenter:
  enabled: true
  categories:
    - id: elite-trainer-box
      label: "엘리트 트레이너 박스"
    - id: booster-packs
      label: "부스터 팩"
    - id: boxed-sets
      label: "박스 세트"
  # 이 키워드가 이름에 있으면 "주력 상품"으로 취급 (대시보드 상단 고정 + 우선 알림)
  priority_keywords: ["30th"]
  # 품절→재고 전환뿐 아니라, 신상품(새 코드)이 등장해도 알림
  notify_new_products: true

# ---- Target -------------------------------------------------
# 노리는 상품의 페이지 URL을 넣으세요. (예시는 지우고 실제 URL로)
target:
  enabled: true
  products: []
    # - name: "Pokemon TCG: 30th Celebration ETB"
    #   url: "https://www.target.com/p/-/A-XXXXXXXX"

# ---- Walmart ------------------------------------------------
walmart:
  enabled: true
  products: []
    # - name: "Pokemon TCG: 30th Celebration ETB"
    #   url: "https://www.walmart.com/ip/XXXXXXXXX"

# ---- 체크 주기 ----------------------------------------------
# hot_windows: 집중 감시 시간대 (한국시간 KST, 24시간제. 자정 넘김 OK)
#   미국 리스톡은 보통 미 동부 아침 = 한국 밤 22시~새벽 1시 (서머타임 기준)
intervals:
  normal_sec: 300        # 평상시 5분 간격
  hot_sec: 25            # 집중 시간대 25초 간격
  hot_windows:
    - "21:30-01:30"
    - "06:00-08:00"

# ---- git 자동 push (대시보드 갱신) ---------------------------
git:
  auto_push: true
  heartbeat_minutes: 15   # 변화 없어도 15분마다 한 번 push (last updated 갱신용)
